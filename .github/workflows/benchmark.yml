name: full-benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check API key present (embeddings needed for dense/hybrid probes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret not configured; benchmark workflow cannot run."
            exit 1
          fi
      - name: Offline deterministic grid (no judge calls)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ragpipe.cli grid-v21 --mode offline
      - name: Red-team suite
        run: python -m ragpipe.cli redteam --mode deterministic
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/v2_1/