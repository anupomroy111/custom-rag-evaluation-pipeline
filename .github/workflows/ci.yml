name: offline-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyyaml
      - name: Syntax check
        run: python -m compileall -q ragpipe scripts examples
      - name: Lint (syntax-level errors only)
        run: ruff check --select E9,F63,F7,F82 ragpipe scripts examples
      - name: Type check (scoped to V2.1 modules)
        run: mypy --ignore-missing-imports --follow-imports=silent ragpipe/evalstats.py ragpipe/manifest.py ragpipe/redteam.py ragpipe/api.py
      - name: Unit + integration + adversarial regression tests (mocked, no API)
        run: python -m pytest tests/ -q
      - name: Dataset schema validation
        run: |
          python - <<'EOF'
          from ragpipe.adversarial.dataset import (
              ADVERSARIAL_PATH, DEVELOPMENT_PATH, HELDOUT_PATH, load_adversarial)
          for p in (ADVERSARIAL_PATH, DEVELOPMENT_PATH, HELDOUT_PATH):
              cases = load_adversarial(p)
              assert cases, p
          print("dataset schemas OK")
          EOF
      - name: Leakage gate
        run: python scripts/check_leakage.py
      - name: Benchmark regression gate (deterministic, no API)
        run: python scripts/regression_gate.py
      - name: Red-team metamorphic gate (deterministic, no API)
        run: python -m ragpipe.cli redteam --mode deterministic
      - name: Secret scan (tracked files only)
        run: |
          if git grep -nE "AQ\.Ab8RN6I|AIza[0-9A-Za-z_-]{30}" -- . ; then
            echo "secret-like string found in tracked files"; exit 1
          fi
          echo "secret scan OK"