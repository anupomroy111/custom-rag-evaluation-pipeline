name: live-evaluation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max questions per stage (quota-bounded)"
        default: "3"

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check API key present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret not configured; live workflow cannot run."
            exit 1
          fi
      - name: Bounded live evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m ragpipe.cli ingest
          python -m ragpipe.cli evaluate-v2 --limit ${{ inputs.limit }}
          python -m ragpipe.cli adversarial --mode semantic --limit ${{ inputs.limit }}
      - uses: actions/upload-artifact@v4
        with:
          name: live-reports
          path: reports/